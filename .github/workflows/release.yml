name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run typecheck

      - name: Package module
        run: bash scripts/package.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moveless-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$VERSION" node --input-type=module -e 'import fs from "node:fs"; const version = process.env.VERSION; const repo = process.env.GITHUB_REPOSITORY; const tag = process.env.GITHUB_REF_NAME; fs.writeFileSync("release.json", JSON.stringify({ version, download_url: `https://github.com/${repo}/releases/download/${tag}/moveless-module.tar.gz` }, null, 2) + "\n");'
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
